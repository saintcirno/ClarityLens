<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bdb" />
      <stop offset="100%" stop-color="#183182" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Material 3 Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#grad)" filter="url(#shadow)" />

  <!-- Clarity Accessibility Lens Glasses -->
  <!-- Left Lens -->
  <circle cx="23" cy="33" r="11" fill="none" stroke="#ffffff" stroke-width="4" />
  <circle cx="23" cy="33" r="5" fill="#66d9e8" opacity="0.9" />

  <!-- Right Lens -->
  <circle cx="41" cy="33" r="11" fill="none" stroke="#ffffff" stroke-width="4" />
  <circle cx="41" cy="33" r="5" fill="#66d9e8" opacity="0.9" />

  <!-- Bridge -->
  <path d="M 29 29 Q 32 25 35 29" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Left Frame Arm -->
  <path d="M 12 32 L 8 27" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Right Frame Arm -->
  <path d="M 52 32 L 56 27" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Sound / Audio Pulse Rays (representing audio speech accessibility) -->
  <path d="M 47 16 A 12 12 0 0 1 54 23" fill="none" stroke="#ffe066" stroke-width="3" stroke-linecap="round" />
  <path d="M 43 20 A 7 7 0 0 1 48 25" fill="none" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round" />
</svg>
